<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国各省美食攻略 · 舌尖上的中国</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root {
  --bg: #0f1117;--bg2: #1a1d27;--bg3: #242836;
  --text: #e0e0e0;--text2: #999;--accent: #e74c3c;
  --accent2: #f39c12;--border: #2a2d3a;--green: #27ae60;--blue: #3498db;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-y:scroll}
.hero{text-align:center;padding:80px 20px 50px;background:linear-gradient(135deg,#1a0a0a 0%,#0f1117 50%,#0a0a1a 100%)}
.hero h1{font-size:3em;font-weight:900;background:linear-gradient(90deg,#e74c3c,#f39c12,#e74c3c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.hero p{color:var(--text2);font-size:1.2em;max-width:700px;margin:0 auto}
.stats{display:flex;justify-content:center;gap:40px;flex-wrap:wrap;padding:30px 20px;max-width:900px;margin:0 auto}
.stat{text-align:center}.stat .num{font-size:2.2em;font-weight:900;color:var(--accent2)}.stat .label{color:var(--text2);font-size:.9em;margin-top:4px}
nav{display:flex;justify-content:center;gap:4px;padding:0 20px 20px;flex-wrap:wrap}
nav button{background:var(--bg2);border:1px solid var(--border);color:var(--text2);padding:10px 24px;border-radius:8px;cursor:pointer;font-size:.95em;transition:all .2s}
nav button:hover{color:var(--text);border-color:var(--accent)}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.container{max-width:1400px;margin:0 auto;padding:0 20px}
.tab-panel{display:none}.tab-panel.active{display:block}
.chart-box{background:var(--bg2);border-radius:12px;padding:20px;margin:20px 0;border:1px solid var(--border)}
.chart-box h3{margin-bottom:15px;color:var(--accent2);font-size:1.15em}
.chart-wrap{width:100%;height:550px}.chart-wrap.map{height:650px}
.section-title{color:var(--accent2);font-size:1.3em;margin:28px 0 14px;padding-left:12px;border-left:3px solid var(--accent)}

/* Cuisine cards with images */
.cuisine-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(340px,1fr));gap:18px;padding:10px 0}
.cuisine-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:transform .2s,border-color .2s}
.cuisine-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.cuisine-card .card-img{width:100%;height:200px;object-fit:cover;display:block;background:var(--bg3)}
.cuisine-card .card-img-fb{width:100%;height:200px;display:flex;align-items:center;justify-content:center;font-size:4em;background:linear-gradient(135deg,#2a1a0a,#1a2a1a)}
.cuisine-card .card-body{padding:18px}
.cuisine-card h3{color:var(--accent2);font-size:1.15em;margin-bottom:8px}
.cuisine-card .province{display:inline-block;background:var(--bg3);padding:2px 10px;border-radius:12px;font-size:.8em;color:var(--text2);margin-right:4px;margin-bottom:4px}
.cuisine-card .dishes{color:var(--text);font-size:.9em;margin:8px 0;line-height:1.7}
.cuisine-card .dish-tag{display:inline-block;background:rgba(231,76,60,.15);color:var(--accent);padding:2px 8px;border-radius:4px;font-size:.82em;margin:2px 3px 2px 0}

/* Province grid */
.province-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(340px,1fr));gap:16px;padding:10px 0}
.province-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;transition:all .2s}
.province-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.province-card .pname{font-size:1.2em;font-weight:700;color:#fff;margin-bottom:6px}
.province-card .pcuisine{color:var(--accent);font-size:.85em;margin-bottom:10px}
.province-card .psection{margin:8px 0}
.province-card .psection .title{color:var(--accent2);font-size:.85em;font-weight:600}
.province-card .psection .content{color:var(--text);font-size:.9em;line-height:1.6}

/* Recipe cards */
.recipe-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(320px,1fr));gap:16px;padding:10px 0}
.recipe-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .2s}
.recipe-card:hover{border-color:var(--accent2);transform:translateY(-2px)}
.recipe-card .recipe-img-wrap{position:relative;height:180px;overflow:hidden}
.recipe-card .recipe-img{width:100%;height:100%;object-fit:cover;display:block;background:var(--bg3)}
.recipe-card .recipe-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.recipe-card:hover .recipe-overlay{opacity:1}
.recipe-overlay span{background:var(--accent);color:#fff;padding:8px 20px;border-radius:20px;font-size:.9em;font-weight:600}
.recipe-card .recipe-body{padding:16px}
.recipe-card .recipe-name{font-size:1.1em;font-weight:700;color:#fff;margin-bottom:4px}
.recipe-card .recipe-meta{display:flex;gap:16px;color:var(--text2);font-size:.82em;margin-bottom:6px}
.recipe-card .recipe-cuisine-tag{display:inline-block;background:rgba(243,156,18,.15);color:var(--accent2);padding:2px 8px;border-radius:4px;font-size:.78em;margin-bottom:4px}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;justify-content:center;align-items:flex-start;overflow-y:auto;padding:40px 20px}
.modal-overlay.show{display:flex}
.modal-content{background:var(--bg2);border:1px solid var(--border);border-radius:16px;max-width:720px;width:100%;margin:auto;padding:0;overflow:hidden}
.modal-header{position:relative;height:280px;overflow:hidden}
.modal-header img{width:100%;height:100%;object-fit:cover}
.modal-close{position:absolute;top:12px;right:12px;width:36px;height:36px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;font-size:1.2em;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.modal-close:hover{background:var(--accent)}
.modal-body{padding:28px}
.modal-body h2{font-size:1.6em;color:#fff;margin-bottom:8px}
.modal-body .modal-tags{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.modal-body .modal-tags span{font-size:.85em;padding:4px 12px;border-radius:12px}
.modal-body .tag-diff{background:rgba(39,174,96,.15);color:var(--green)}
.modal-body .tag-time{background:rgba(52,152,219,.15);color:var(--blue)}
.modal-body .tag-cuisine{background:rgba(243,156,18,.15);color:var(--accent2)}
.modal-section{margin-bottom:20px}
.modal-section h4{color:var(--accent2);font-size:1em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.modal-section .ingredients{display:flex;flex-wrap:wrap;gap:6px}
.modal-section .ingredient{background:var(--bg3);padding:4px 12px;border-radius:6px;font-size:.88em;color:var(--text)}
.modal-section .step{margin-bottom:12px;padding:12px;background:var(--bg3);border-radius:8px}
.modal-section .step .step-num{display:inline-block;background:var(--accent);color:#fff;width:24px;height:24px;border-radius:50%;text-align:center;line-height:24px;font-size:.8em;font-weight:700;margin-right:8px}
.modal-section .step .step-text{color:var(--text);font-size:.9em;line-height:1.7}
.modal-tip{background:rgba(243,156,18,.08);border:1px solid rgba(243,156,18,.2);border-radius:8px;padding:12px 16px;color:var(--text);font-size:.88em;line-height:1.6}

.search-box{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}
.search-box input{flex:1;min-width:250px;padding:12px 16px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:.95em}
.search-box select{padding:12px 16px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:.95em;cursor:pointer}
footer{text-align:center;padding:40px 20px;color:var(--text2);font-size:.85em}
@media(max-width:768px){
  .hero h1{font-size:2em}.stats{gap:20px}.stat .num{font-size:1.5em}
  .chart-wrap{height:350px}.chart-wrap.map{height:400px}
  .cuisine-grid{grid-template-columns:1fr}.recipe-grid{grid-template-columns:1fr}
  .modal-header{height:200px}
}
</style>
</head>
<body>

<div class="hero">
  <h1>舌尖上的中国</h1>
  <p>一图览尽中国 34 个省级行政区的美食文化 —— 八大菜系、地方风味、特色小吃，品味华夏五千年的烟火人间</p>
</div>

<div class="stats">
  <div class="stat"><div class="num">34</div><div class="label">省级行政区</div></div>
  <div class="stat"><div class="num">8</div><div class="label">传统菜系</div></div>
  <div class="stat"><div class="num">200+</div><div class="label">代表菜品</div></div>
  <div class="stat"><div class="num">16</div><div class="label">名菜做法</div></div>
</div>

<nav>
  <button class="active" onclick="switchTab('cuisine')">八大菜系</button>
  <button onclick="switchTab('map')">美食地图</button>
  <button onclick="switchTab('provinces')">各省详解</button>
  <button onclick="switchTab('recipes')">名菜做法</button>
</nav>

<div class="container">

<!-- ===== 八大菜系 ===== -->
<div id="tab-cuisine" class="tab-panel active">
  <div class="chart-box">
    <h3>八大菜系风味雷达图</h3>
    <div class="chart-wrap" id="chart-radar"></div>
  </div>
  <div class="chart-box">
    <h3>菜系影响力对比</h3>
    <div class="chart-wrap" id="chart-influence"></div>
  </div>
  <div class="cuisine-grid" id="cuisine-grid"></div>
</div>

<!-- ===== 美食地图 ===== -->
<div id="tab-map" class="tab-panel">
  <div class="chart-box">
    <h3>中国各省美食分布 · 点击省份查看详情</h3>
    <div class="chart-wrap map" id="chart-map"></div>
  </div>
  <div class="chart-box">
    <h3>各省美食品类分布</h3>
    <div class="chart-wrap" id="chart-bar"></div>
  </div>
</div>

<!-- ===== 各省详解 ===== -->
<div id="tab-provinces" class="tab-panel">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索省份、菜名、口味..." oninput="filterProvinces()">
    <select id="cuisineFilter" onchange="filterProvinces()">
      <option value="">全部菜系</option>
      <option value="川菜">川菜</option><option value="粤菜">粤菜</option><option value="苏菜">苏菜</option>
      <option value="闽菜">闽菜</option><option value="浙菜">浙菜</option><option value="湘菜">湘菜</option>
      <option value="徽菜">徽菜</option><option value="鲁菜">鲁菜</option>
      <option value="地方特色">地方特色</option>
    </select>
  </div>
  <div class="province-grid" id="province-grid"></div>
</div>

<!-- ===== 名菜做法 ===== -->
<div id="tab-recipes" class="tab-panel">
  <div class="search-box">
    <input type="text" id="recipeSearch" placeholder="搜索菜名、食材..." oninput="filterRecipes()">
    <select id="recipeCuisineFilter" onchange="filterRecipes()">
      <option value="">全部菜系</option>
      <option value="川菜">川菜</option><option value="粤菜">粤菜</option><option value="苏菜">苏菜</option>
      <option value="闽菜">闽菜</option><option value="浙菜">浙菜</option><option value="湘菜">湘菜</option>
      <option value="徽菜">徽菜</option><option value="鲁菜">鲁菜</option>
    </select>
  </div>
  <div class="recipe-grid" id="recipe-grid"></div>
</div>

</div>

<!-- ===== Recipe Detail Modal ===== -->
<div class="modal-overlay" id="recipeModal" onclick="if(event.target===this)closeModal()">
  <div class="modal-content" id="modalContent"></div>
</div>

<footer>数据整理自公开资料 · 菜品图片来自 Wikipedia Commons · 做法仅供参考</footer>

<script>
// ===== IMAGE MAP (Wikipedia/Commons verified) =====
const DISH_IMG = {
  '麻婆豆腐':   'https://upload.wikimedia.org/wikipedia/commons/thumb/8/88/Chen_Mapo_Tofu.jpg/960px-Chen_Mapo_Tofu.jpg',
  '宫保鸡丁':   'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/Kung-pao-shanghai.jpg/960px-Kung-pao-shanghai.jpg',
  '白切鸡':     'https://upload.wikimedia.org/wikipedia/commons/thumb/a/ae/BeiQieJi-WhiteCutChicken.jpg/960px-BeiQieJi-WhiteCutChicken.jpg',
  '干炒牛河':   'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Beefchowfoon.jpg/960px-Beefchowfoon.jpg',
  '佛跳墙':     'https://upload.wikimedia.org/wikipedia/commons/5/56/Buddha_soup_boul.jpg',
  '海蛎煎':     'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ef/Billyfoodoysteromelette.jpg/960px-Billyfoodoysteromelette.jpg',
  '东坡肉':     'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fd/BCfood12.JPG/960px-BCfood12.JPG',
  '松鼠鳜鱼':   'https://upload.wikimedia.org/wikipedia/commons/e/ef/%E6%9D%BE%E9%BC%A0%E9%B3%9C%E9%B1%BC.jpg',
  '西湖醋鱼':   'https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/West_Lake_Fish_in_Vinegar_Gravy_Feb_2026.jpg/960px-West_Lake_Fish_in_Vinegar_Gravy_Feb_2026.jpg',
  '剁椒鱼头':   'https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/Steamed_Fish_Head_with_Diced_Chili_%2820150726122046%29.jpg/960px-Steamed_Fish_Head_with_Diced_Chili_%2820150726122046%29.jpg',
  '辣椒炒肉':   'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/Saut%C3%A9ed_pork_with_chili_pepper_at_Yinxiang_Restaurant_%2820210522180012%29.jpg/960px-Saut%C3%A9ed_pork_with_chili_pepper_at_Yinxiang_Restaurant_%2820210522180012%29.jpg',
  '九转大肠':   'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Jiuqu_dachang_2009_03.jpg/960px-Jiuqu_dachang_2009_03.jpg',
  '葱烧海参':   'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/Braised_Guandong_Sea_Cucumber_with_Scallion_in_Sauce.jpg/960px-Braised_Guandong_Sea_Cucumber_with_Scallion_in_Sauce.jpg',
  '回锅肉':     'https://upload.wikimedia.org/wikipedia/commons/thumb/0/00/Huiguorou_made_from_Neijiang_local_pork_at_Daqian_Restaurant%2C_Beidadi_%2820251011111845%29.jpg/960px-Huiguorou_made_from_Neijiang_local_pork_at_Daqian_Restaurant%2C_Beidadi_%2820251011111845%29.jpg',
  '北京烤鸭':   'https://upload.wikimedia.org/wikipedia/commons/thumb/8/81/Peking_Duck%2C_2014_%2802%29.jpg/960px-Peking_Duck%2C_2014_%2802%29.jpg',
  '兰州牛肉面': 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/%E5%8A%A0%E8%BE%A3%E5%AD%90%E7%9A%84%E5%85%B0%E5%B7%9E%E7%89%9B%E8%82%89%E9%9D%A2.jpg/960px-%E5%8A%A0%E8%BE%A3%E5%AD%90%E7%9A%84%E5%85%B0%E5%B7%9E%E7%89%9B%E8%82%89%E9%9D%A2.jpg',
  '清炖蟹粉狮子头': 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Lions_head_meatballs_in_brown_sauce.jpg/960px-Lions_head_meatballs_in_brown_sauce.jpg',
  '臭鳜鱼':     'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0a/Fermented_mandarin_fish.jpg/960px-Fermented_mandarin_fish.jpg',
  '毛豆腐':     'https://upload.wikimedia.org/wikipedia/commons/thumb/0/03/Hairy_Tofu.jpg/960px-Hairy_Tofu.jpg',
};

// Cuisine card images: use the most iconic dish from each cuisine
function cuisineImg(cuisine) {
  const m = {
    '川菜': DISH_IMG['麻婆豆腐'],
    '粤菜': DISH_IMG['白切鸡'],
    '苏菜': DISH_IMG['松鼠鳜鱼'],
    '闽菜': DISH_IMG['佛跳墙'],
    '浙菜': DISH_IMG['东坡肉'],
    '湘菜': DISH_IMG['剁椒鱼头'],
    '徽菜': DISH_IMG['回锅肉'],
    '鲁菜': DISH_IMG['九转大肠'],
  };
  return m[cuisine] || DISH_IMG['北京烤鸭'];
}

// Recipe images: exact match or fallback to cuisine image
function recipeImg(name, cuisine) {
  return DISH_IMG[name] || cuisineImg(cuisine);
}

// ===== CUISINE DATA =====
const CUISINES = [
  {name:'川菜',taste:'麻辣鲜香',traits:'百菜百味，一菜一格',provinces:['四川','重庆'],dishes:'宫保鸡丁、麻婆豆腐、回锅肉、水煮鱼、夫妻肺片、鱼香肉丝、担担面、蒜泥白肉',story:'发源于巴蜀地区，以麻辣著称，讲究味型多变。川菜的灵魂是郫县豆瓣和花椒，是中国覆盖面最广的菜系之一。',emoji:'🌶️'},
  {name:'粤菜',taste:'清鲜嫩滑',traits:'食在广州，味在潮汕',provinces:['广东','香港','澳门'],dishes:'白切鸡、烧鹅、蜜汁叉烧、清蒸石斑鱼、干炒牛河、虾饺、肠粉、煲仔饭',story:'粤菜追求食材本味，讲究火候和镬气。广州是千年商都，食材丰富，早茶文化名扬天下。',emoji:'🦐'},
  {name:'苏菜',taste:'清鲜平和',traits:'刀工精细，造型雅致',provinces:['江苏'],dishes:'松鼠鳜鱼、清炖蟹粉狮子头、大煮干丝、盐水鸭、叫花鸡、扬州炒饭、无锡酱排骨',story:'江苏是鱼米之乡，河鲜丰富。淮扬菜是国宴首选，以精细典雅著称。',emoji:'🐟'},
  {name:'闽菜',taste:'鲜香清淡',traits:'汤菜居多，讲究火候',provinces:['福建'],dishes:'佛跳墙、荔枝肉、海蛎煎、沙茶面、土笋冻、福州鱼丸、莆田卤面、姜母鸭',story:'福建靠海，海鲜丰富。佛跳墙是闽菜之王，沙茶面是厦门街头灵魂。',emoji:'🦀'},
  {name:'浙菜',taste:'鲜美滑嫩',traits:'清爽不腻，制作精细',provinces:['浙江'],dishes:'东坡肉、西湖醋鱼、龙井虾仁、叫化童子鸡、宋嫂鱼羹、金华火腿、片儿川',story:'浙江是江南水乡，食材以鱼虾蔬果为主。东坡肉与苏东坡的典故最为人乐道。',emoji:'🍖'},

// ===== TABS =====
function switchTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  event.target.classList.add('active');
  if (tab==='cuisine'){renderRadar();renderInfluence()}
  if (tab==='map'){renderMap();renderBar()}
  if (tab==='recipes'){renderRecipeGrid()}
  setTimeout(()=>{
    if (tab==='cuisine'){renderRadar();renderInfluence()}
    if (tab==='map'){renderMap();renderBar()}
  },100);
}

// ===== CUISINE GRID WITH IMAGES =====
function renderCuisineGrid(){
  document.getElementById('cuisine-grid').innerHTML = CUISINES.map(c => `
    <div class="cuisine-card">
      <img class="card-img" src="${cuisineImg(c.name)}" alt="${c.name}" loading="lazy"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="card-img-fb" style="display:none">${c.emoji}</div>
      <div class="card-body">
        <h3>${c.emoji} ${c.name}</h3>
        <div>${c.provinces.map(p => `<span class="province">${p}</span>`).join('')}</div>
        <div style="color:var(--accent);font-size:.9em;margin:6px 0;">${c.traits} · ${c.taste}</div>
        <div class="dishes">
          ${c.dishes.split('、').map(d => `<span class="dish-tag">${d}</span>`).join('')}
        </div>
        <div style="color:var(--text2);font-size:.82em;margin-top:8px;line-height:1.6;">${c.story}</div>
      </div>
    </div>
  `).join('');
}
renderCuisineGrid();

// ===== PROVINCE GRID =====
function renderProvinceGrid(filter='',cuisine=''){
  const grid = document.getElementById('province-grid');
  const filtered = PROVINCES.filter(p => {
    const ms = !filter||p.name.includes(filter)||p.dishes.includes(filter)||p.snacks.includes(filter)||p.cuisine.includes(filter)||p.taste.includes(filter);
    const mc = !cuisine||p.cuisine.includes(cuisine);
    return ms&&mc;
  });
  grid.innerHTML = filtered.map(p => `
    <div class="province-card">
      <div class="pname">${p.name}</div>
      <div class="pcuisine">${p.cuisine} · ${p.taste}</div>
      <div class="psection"><div class="title">🏆 代表菜</div><div class="content">${p.dishes}</div></div>
      <div class="psection"><div class="title">🍡 特色小吃</div><div class="content">${p.snacks}</div></div>
      <div class="psection"><div class="title">📍 推荐城市</div><div class="content">${p.city}</div></div>
      <div style="color:var(--text2);font-size:.82em;margin-top:6px;line-height:1.5;border-top:1px solid var(--border);padding-top:8px;">${p.note}</div>
    </div>
  `).join('');
}
renderProvinceGrid();

function filterProvinces(){
  renderProvinceGrid(document.getElementById('searchInput').value.trim(), document.getElementById('cuisineFilter').value);
}

// ===== RECIPE GRID =====
function renderRecipeGrid(filter='',cuisine=''){
  const grid = document.getElementById('recipe-grid');
  const filtered = RECIPES.filter(r => {
    const ms = !filter||r.name.includes(filter)||r.main.concat(r.aux).concat(r.season).some(i=>i.includes(filter))||r.cuisine.includes(filter);
    const mc = !cuisine||r.cuisine===cuisine;
    return ms&&mc;
  });
  grid.innerHTML = filtered.map(r => `
    <div class="recipe-card" onclick="openRecipe('${r.id}')">
      <div class="recipe-img-wrap">
        <img class="recipe-img" src="${recipeImg(r.name, r.cuisine)}" alt="${r.name}" loading="lazy"
          onerror="this.style.background='var(--bg3)';this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22320%22 height=%22180%22><rect fill=%22%23242836%22 width=%22320%22 height=%22180%22/><text fill=%22%23999%22 x=%22160%22 y=%2295%22 text-anchor=%22middle%22 font-size=%2240%22>🍳</text></svg>'">
        <div class="recipe-overlay"><span>查看做法</span></div>
      </div>
      <div class="recipe-body">
        <span class="recipe-cuisine-tag">${r.cuisine}</span>
        <div class="recipe-name">${r.name}</div>
        <div class="recipe-meta">
          <span>🔥 ${r.diff}</span><span>⏱️ ${r.time}</span>
        </div>
      </div>
    </div>
  `).join('');
}
renderRecipeGrid();

function filterRecipes(){
  renderRecipeGrid(document.getElementById('recipeSearch').value.trim(), document.getElementById('recipeCuisineFilter').value);
}

// ===== RECIPE MODAL =====
function openRecipe(id){
  const r = RECIPES.find(r=>r.id===id);
  if(!r)return;
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-header">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <img src="${recipeImg(r.name, r.cuisine)}" alt="${r.name}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22720%22 height=%22280%22><rect fill=%22%23242836%22 width=%22720%22 height=%22280%22/><text fill=%22%23999%22 x=%22360%22 y=%22150%22 text-anchor=%22middle%22 font-size=%2260%22>🍳</text></svg>'">
    </div>
    <div class="modal-body">
      <h2>${r.name}</h2>
      <div class="modal-tags">
        <span class="tag-cuisine">${r.cuisine}</span><span class="tag-diff">🔥 ${r.diff}</span><span class="tag-time">⏱️ ${r.time}</span>
      </div>
      <div class="modal-section"><h4>🥩 主料</h4><div class="ingredients">${r.main.map(i=>`<span class="ingredient">${i}</span>`).join('')}</div></div>
      <div class="modal-section"><h4>🥬 辅料</h4><div class="ingredients">${r.aux.map(i=>`<span class="ingredient">${i}</span>`).join('')}</div></div>
      <div class="modal-section"><h4>🧂 调料</h4><div class="ingredients">${r.season.map(i=>`<span class="ingredient">${i}</span>`).join('')}</div></div>
      <div class="modal-section"><h4>📋 步骤</h4>${r.steps.map((s,i)=>`<div class="step"><span class="step-num">${i+1}</span><span class="step-text">${s}</span></div>`).join('')}</div>
      <div class="modal-tip">💡 <b>小贴士：</b>${r.tip}</div>
    </div>`;
  document.getElementById('recipeModal').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('recipeModal').classList.remove('show');
  document.body.style.overflow='';
}

// ===== CHARTS =====
let radarCh, infCh, mapCh, barCh;
function renderRadar(){
  if(!radarCh)radarCh=echarts.init(document.getElementById('chart-radar'));
  const ind = CUISINES.map(c=>({name:c.name,max:100}));
  radarCh.setOption({
    tooltip:{},legend:{data:['麻辣度','鲜美度','精细度','油重度','知名度'],textStyle:{color:'#999'}},
    radar:{indicator:ind,shape:'polygon',axisName:{color:'#999'},splitArea:{areaStyle:{color:['#1a1d27','#0f1117']}}},
    series:[{type:'radar',data:[
      {name:'麻辣度',value:[95,5,5,8,5,80,8,15],areaStyle:{opacity:.15}},
      {name:'鲜美度',value:[30,90,85,88,82,35,65,70],areaStyle:{opacity:.15}},
      {name:'精细度',value:[40,95,90,80,85,45,70,75],areaStyle:{opacity:.15}},
      {name:'油重度',value:[80,35,45,40,42,75,78,65],areaStyle:{opacity:.15}},
      {name:'知名度',value:[95,90,82,70,78,80,60,72],areaStyle:{opacity:.15}},
    ],lineStyle:{width:2}}]
  });
}
function renderInfluence(){
  if(!infCh)infCh=echarts.init(document.getElementById('chart-influence'));
  const s = [...CUISINES].sort((a,b)=>b.dishes.split('、').length-a.dishes.split('、').length);
  infCh.setOption({
    tooltip:{trigger:'axis'},grid:{left:80,right:40,bottom:20,top:10},
    xAxis:{type:'value',axisLabel:{color:'#999'}},
    yAxis:{type:'category',data:s.map(c=>c.name).reverse(),axisLabel:{color:'#ddd'}},
    series:[{type:'bar',data:s.map(c=>c.dishes.split('、').length).reverse(),
      itemStyle:{color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#e74c3c'},{offset:1,color:'#f39c12'}])},
      label:{show:true,position:'right',color:'#999'}}]
  });
}
async function renderMap(){
  if(!mapCh)mapCh=echarts.init(document.getElementById('chart-map'));
  try{
    const resp=await fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json');
    echarts.registerMap('china',await resp.json());
    const md=PROVINCES.map(p=>({
      name:(p.name==='香港'?'香港特别行政区':p.name==='澳门'?'澳门特别行政区':p.name==='内蒙古'?'内蒙古自治区':p.name==='西藏'?'西藏自治区':p.name==='新疆'?'新疆维吾尔自治区':p.name==='广西'?'广西壮族自治区':p.name==='宁夏'?'宁夏回族自治区':p.name.endsWith('省')?p.name:p.name+'省').replace('重庆省','重庆市').replace('北京省','北京市').replace('天津省','天津市').replace('上海省','上海市').replace('台湾省','台湾省'),
      value:p.dishes.split('、').length+p.snacks.split('、').length
    }));
    mapCh.setOption({
      tooltip:{trigger:'item',formatter:p=>p.name?`<b>${p.name}</b><br/>美食品类: ${p.value||0} 种`:''},
      visualMap:{min:5,max:18,text:['多','少'],realtime:false,calculable:true,inRange:{color:['#2a1a0a','#4a2010','#8b2500','#c0392b','#e74c3c']},textStyle:{color:'#999'}},
      series:[{type:'map',map:'china',data:md,label:{show:true,color:'#ccc',fontSize:10},
        emphasis:{label:{show:true,color:'#fff',fontSize:14},itemStyle:{areaColor:'#f39c12'}},
        itemStyle:{borderColor:'#3a3d4a',borderWidth:.5}}]
    });
    mapCh.off('click');mapCh.on('click',function(par){
      if(par.name){
        document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
        document.getElementById('tab-provinces').classList.add('active');
        document.querySelectorAll('nav button')[2].classList.add('active');
        document.getElementById('searchInput').value=par.name.replace(/省|市|特别行政区|自治区|维吾尔|壮族|回族/g,'');
        renderProvinceGrid(par.name.replace(/省|市|特别行政区|自治区|维吾尔|壮族|回族/g,''));
      }
    });
  }catch(e){
    mapCh.setOption({title:{text:'地图加载中...',left:'center',top:'center',textStyle:{color:'#999',fontSize:16}}});
    setTimeout(renderMap,1500);
  }
}
function renderBar(){
  if(!barCh)barCh=echarts.init(document.getElementById('chart-bar'));
  const s=[...PROVINCES].sort((a,b)=>(b.dishes.split('、').length+b.snacks.split('、').length)-(a.dishes.split('、').length+a.snacks.split('、').length));
  barCh.setOption({
    tooltip:{trigger:'axis'},grid:{left:80,right:60,bottom:20,top:30},
    xAxis:{type:'value',axisLabel:{color:'#999'}},
    yAxis:{type:'category',data:s.map(p=>p.name).reverse(),axisLabel:{color:'#ddd',fontSize:11}},
    series:[
      {type:'bar',name:'代表菜',data:s.map(p=>p.dishes.split('、').length).reverse(),itemStyle:{color:'#e74c3c'},stack:'total'},
      {type:'bar',name:'小吃',data:s.map(p=>p.snacks.split('、').length).reverse(),itemStyle:{color:'#f39c12'},stack:'total'}
    ],
    legend:{data:['代表菜','小吃'],textStyle:{color:'#999'},top:0}
  });
}

window.addEventListener('load',()=>{renderRadar();renderInfluence()});
window.addEventListener('resize',()=>{
  const t=document.querySelector('.tab-panel.active')?.id;
  if(t==='tab-cuisine'){renderRadar();renderInfluence()}
  if(t==='tab-map'){renderMap();renderBar()}
});
</script>
</body>
</html>
